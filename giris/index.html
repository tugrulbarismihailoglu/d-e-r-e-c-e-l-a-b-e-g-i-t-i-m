<!DOCTYPE html>

    <style>
        .material-symbols-outlined {

        .academic-pattern {
            background-image: radial-gradient(circle at 2px 2px, #f3f4f6 1px, transparent 0);

        .nav-link {

            padding: 0.5rem 0.75rem;

            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .error-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    
        /* Floating Math & Code Elements */
        .math-float {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-weight: 800;
            color: rgba(234, 88, 12, 0.40);
            animation: gentleDrift var(--dur, 0.5s) ease-in-out infinite alternate;
            animation-delay: var(--delay, 0s);
            will-change: transform;
            user-select: none;
            white-space: nowrap;
        }

        .geo-float {
            position: absolute;
            animation: gentleDrift var(--dur, 0.5s) ease-in-out infinite alternate;
            animation-delay: var(--delay, 0s);
            will-change: transform;
        }

        .geo-float svg {
            stroke: rgba(234, 88, 12, 0.30);
            fill: none;
            stroke-width: 1.5;
        }

        @keyframes gentleDrift {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                transform: translate(var(--dx, 25px), var(--dy, -30px)) rotate(var(--rot, 5deg)) scale(var(--sc, 1.05));
            }
        }

    <script>
        // Header Navigation Mechanics
        const navIndicator = document.getElementById('nav-indicator');
        const navLinks = document.querySelectorAll('.nav-link');
        const navContainer = document.getElementById('main-nav');

        const updateIndicator = (element) => {
            if (!element) {
                navIndicator.style.opacity = '0';
                return;
            }
            const rect = element.getBoundingClientRect();
            const parentRect = navContainer.getBoundingClientRect();
            const padding = 12;

            navIndicator.style.width = `${rect.width - (padding * 2)}px`;
            navIndicator.style.left = `${rect.left - parentRect.left + padding}px`;
            navIndicator.style.opacity = '1';
        };

        navLinks.forEach(link => {
            link.addEventListener('mouseenter', () => updateIndicator(link));
            link.addEventListener('mouseleave', () => {
                const activeLink = document.querySelector('.nav-link.active');
                updateIndicator(activeLink);
            });
        });

        // Cart Drawer Mechanics
        const cartDrawer = document.getElementById('cart-drawer');
        const cartOverlay = document.getElementById('cart-overlay');
        const openCartBtn = document.getElementById('open-cart');
        const closeCartBtn = document.getElementById('close-cart');

        const openCart = () => {
            cartDrawer.classList.remove('translate-x-full');
            cartOverlay.classList.remove('opacity-0', 'pointer-events-none');
            document.body.style.overflow = 'hidden';
        };

        const closeCart = () => {
            cartDrawer.classList.add('translate-x-full');
            cartOverlay.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = '';
        };

        openCartBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);

        // Initial setup
        window.addEventListener('load', () => {
            const activeLink = document.querySelector('.nav-link.active');
            if (activeLink) updateIndicator(activeLink);
        });

        // =====================================================
        // Firebase Login Logic
        // =====================================================
        const loginForm = document.getElementById('login-form');
        const authMessage = document.getElementById('auth-message');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        // Firebase hata mesajlarını Türkçeye çevir
        function getErrorMessage(code) {
            const messages = {
                'auth/invalid-email': 'Geçersiz e-posta adresi.',
                'auth/user-disabled': 'Bu hesap devre dışı bırakılmış.',
                'auth/user-not-found': 'Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.',
                'auth/wrong-password': 'Hatalı şifre. Lütfen tekrar deneyin.',
                'auth/invalid-credential': 'E-posta veya şifre hatalı.',
                'auth/too-many-requests': 'Çok fazla başarısız giriş denemesi. Lütfen biraz bekleyin.',
                'auth/network-request-failed': 'Ağ bağlantısı hatası. İnternet bağlantınızı kontrol edin.',
            };
            return messages[code] || 'Bir hata oluştu. Lütfen tekrar deneyin.';
        }

        function showMessage(text, isError = true) {
            authMessage.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-200', 'bg-green-50', 'text-green-600', 'border-green-200');
            if (isError) {
                authMessage.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-200');
                authMessage.innerHTML = `<span class="material-symbols-outlined text-lg">error</span>${text}`;
                authMessage.classList.add('error-shake');
                setTimeout(() => authMessage.classList.remove('error-shake'), 400);
            } else {
                authMessage.classList.add('bg-green-50', 'text-green-600', 'border', 'border-green-200');
                authMessage.innerHTML = `<span class="material-symbols-outlined text-lg">check_circle</span>${text}`;
            }
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            if (loading) {
                btnText.textContent = 'Giriş yapılıyor...';
                btnSpinner.classList.remove('hidden');
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                btnText.textContent = 'Giriş Yap';
                btnSpinner.classList.add('hidden');
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!email || !password) {
                showMessage('Lütfen tüm alanları doldurun.');
                return;
            }

            setLoading(true);

            try {
                // "Beni hatırla" → oturum kalıcılığı ayarla
                const persistence = remember
                    ? firebase.auth.Auth.Persistence.LOCAL
                    : firebase.auth.Auth.Persistence.SESSION;
                await auth.setPersistence(persistence);

                // Firebase Auth — Giriş yap
                const userCredential = await auth.signInWithEmailAndPassword(email, password);

                showMessage('Giriş başarılı! Yönlendiriliyorsunuz...', false);

                // Yönlendirme mantığı
                setTimeout(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');
                    
                    if (redirectUrl) {
                        // Eğer özel bir redirect URL'i varsa ona git
                        window.location.href = redirectUrl;
                    } else {
                        // Varsayılan olarak panele git
                        window.location.href = '../panel/';
                    }
                }, 1000);

            } catch (error) {
                console.error('Giriş hatası:', error);
                showMessage(getErrorMessage(error.code));
                setLoading(false);
            }
        });

        // Şifremi Unuttum
        async function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage('Lütfen önce e-posta adresinizi girin.');
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('Şifre sıfırlama e-postası gönderildi! Lütfen e-postanızı kontrol edin.<br><strong class="block mt-1.5 font-black text-green-700 underline underline-offset-2">Lütfen spam klasörünüzü kontrol etmeyi unutmayın.</strong>', false);
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    showMessage('Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.');
                } else {
                    showMessage(getErrorMessage(error.code));
                }
            }
        }

        // Preserve redirect in link
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');
            if (redirect) {
                const registerLink = document.querySelector('a[href="../kayit/"]');
                if (registerLink) registerLink.href += '?redirect=' + encodeURIComponent(redirect);
            }
        });
    </script>
